name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: yarn install

      - name: Expo Prebuild Android
        run: yarn --cwd expo54 expo prebuild --platform android --no-install

      - name: Make Gradlew Executable
        run: chmod +x expo54/android/gradlew

      - name: Build Android APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'"
        run: |
          cd expo54/android
          ./gradlew assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon || ./gradlew assembleDebug -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeCBT-APK
          path: expo54/android/app/build/outputs/apk/**/*.apk
