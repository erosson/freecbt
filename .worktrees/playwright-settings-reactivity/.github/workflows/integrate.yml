name: Continuous Integration

on:
  pull_request:
    branches: [dndrade/main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22.x
      - run: yarn --dev --frozen-lockfile
      - run: yarn test
        working-directory: expo54
